
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#F4DCE8">

    <meta name="description"
          content="가족의 행복과 소중한 매일의 기원을 기록하는 공간입니다.">

    <title>진심으로 행복을 기원합니다 🌸</title>

    <!-- PWA 설정 -->
    <link rel="manifest" href="./manifest.json">

    <!-- 홈 화면 아이콘 -->
    <link rel="icon"
          type="image/png"
          sizes="192x192"
          href="./아이콘/icon-192.png">

    <link rel="apple-touch-icon"
          href="./아이콘/icon-192.png">

    <!-- 카카오톡 및 SNS 공유 미리보기 -->
    <meta property="og:type" content="website">

    <meta property="og:title"
          content="🌸 진심으로 행복을 기원합니다">

    <meta property="og:description"
          content="가족의 행복과 소중한 매일의 기원을 기록하는 공간입니다.">

    <meta property="og:image"
          content="https://acok77777.github.io/happiness/아이콘/icon-512.png">

    <meta property="og:image:secure_url"
          content="https://acok77777.github.io/happiness/아이콘/icon-512.png">

    <meta property="og:image:type"
          content="image/png">

    <meta property="og:image:width"
          content="512">

    <meta property="og:image:height"
          content="512">

    <meta property="og:url"
          content="https://acok77777.github.io/happiness/">

    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="twitter:title"
          content="진심으로 행복을 기원합니다">

    <meta name="twitter:description"
          content="가족의 행복과 소중한 매일의 기원을 기록하는 공간입니다.">

    <meta name="twitter:image"
          content="https://acok77777.github.io/happiness/아이콘/icon-512.png">

    <!-- 디자인 CSS -->
    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <div class="app-container">

        <!-- =================================
             메인 화면
        ================================== -->

        <section id="homeScreen" class="screen active">

            <header class="main-header">

                <div class="eyebrow">
                    FAMILY PRAYER JOURNAL
                </div>

                <h1>
                    🌸 진심으로 행복을 기원합니다
                </h1>

                <p class="subtitle">
                    소중한 매일의 기원을 기록해 보세요.
                </p>

            </header>

            <div class="home-decoration">
                🌷 🌸 🧁 🌼
            </div>

            <div class="home-menu">

                <button
                    class="menu-card"
                    data-go="prayers">

                    <span class="menu-icon">🌸</span>

                    <span class="menu-title">
                        가족기원문
                    </span>

                    <span class="menu-description">
                        가족의 행복과 소망을 기원합니다.
                    </span>

                    <span class="menu-arrow">→</span>

                </button>


                <button
                    class="menu-card"
                    data-go="roster">

                    <span class="menu-icon">🌷</span>

                    <span class="menu-title">
                        명단
                    </span>

                    <span class="menu-description">
                        소중한 분들의 매일 기원을 기록합니다.
                    </span>

                    <span class="menu-arrow">→</span>

                </button>

            </div>

            <div class="home-tools">

                <button id="backupButton">
                    💾 백업 파일 저장
                </button>

                <button id="restoreButton">
                    📂 백업 파일 복원
                </button>

                <input
                    type="file"
                    id="importFile"
                    accept=".json,application/json"
                    hidden>

            </div>

            <footer class="app-footer">
                🌸 매일의 진심이 모여 행복한 인생으로 🌸
            </footer>

        </section>


        <!-- =================================
             명단 기원 기록 화면
        ================================== -->

        <section id="rosterScreen" class="screen">

            <header class="page-header">

                <div class="eyebrow">
                    NAME PRAYER TRACKER
                </div>

                <h1>
                    🌷 명단 기원 기록
                </h1>

                <p class="subtitle">
                    이름별로 날짜를 체크해 보세요.
                </p>

            </header>


            <!-- 연도 월 선택 -->

            <div class="date-panel">

                <label for="rosterYear">
                    연도
                </label>

                <select id="rosterYear"></select>

                <label for="rosterMonth">
                    월
                </label>

                <select id="rosterMonth"></select>

                <button id="rosterToday">
                    오늘
                </button>

            </div>


            <p class="save-notice">
                ✓ 체크한 날짜는 자동 저장됩니다.
            </p>


            <!-- 명단 표 -->

            <div class="table-wrapper">

                <table id="rosterTable">
                </table>

            </div>


            <p id="rosterCount" class="count-text">
                0개 체크
            </p>


            <!-- 명단 관리 -->

            <div class="management-panel">

                <h3>🌼 명단 관리</h3>

                <button
                    id="manageNamesButton"
                    class="secondary-button">

                    이름 추가 · 수정 · 삭제

                </button>

            </div>


            <!-- 하단 버튼 -->

            <div class="bottom-buttons">

                <button
                    class="secondary-button"
                    data-back>

                    ← 이전

                </button>

                <button
                    id="saveRosterButton"
                    class="primary-button">

                    💾 저장

                </button>

                <button
                    class="secondary-button"
                    data-home>

                    나가기

                </button>

            </div>

        </section>


        <!-- =================================
             가족 기원문 화면
        ================================== -->

        <section id="prayersScreen" class="screen">

            <header class="page-header">

                <div class="eyebrow">
                    FAMILY PRAYER JOURNAL
                </div>

                <h1>
                    🌸 가족기원문
                </h1>

                <p class="subtitle">
                    기원문을 읽고 실천한 날을 표시하세요.
                </p>

            </header>


            <!-- 연도 월 선택 -->

            <div class="date-panel">

                <label for="prayerYear">
                    연도
                </label>

                <select id="prayerYear"></select>

                <label for="prayerMonth">
                    월
                </label>

                <select id="prayerMonth"></select>

                <button id="prayerToday">
                    오늘
                </button>

            </div>


            <p class="save-notice">
                ✓ 기원문별 날짜 체크는 자동 저장됩니다.
            </p>


            <!-- 기원문 목록 -->

            <div id="prayerList">
            </div>


            <!-- 기원문 관리 -->

            <div class="management-panel">

                <h3>🌷 기원문 관리</h3>

                <button
                    id="managePrayersButton"
                    class="secondary-button">

                    기원문 추가 · 수정 · 삭제

                </button>

            </div>


            <!-- 하단 버튼 -->

            <div class="bottom-buttons">

                <button
                    class="secondary-button"
                    data-back>

                    ← 이전

                </button>

                <button
                    id="savePrayerButton"
                    class="primary-button">

                    💾 저장

                </button>

                <button
                    class="secondary-button"
                    data-home>

                    나가기

                </button>

            </div>

        </section>

    </div>


    <!-- =================================
         명단 관리 창
    ================================== -->

    <dialog id="nameDialog" class="manage-dialog">

        <div class="dialog-header">

            <h2>🌸 명단 관리</h2>

            <button
                type="button"
                onclick="document.getElementById('nameDialog').close()">

                ✕

            </button>

        </div>


        <form id="nameAddForm">

            <input
                type="text"
                id="newNameInput"
                placeholder="추가할 이름을 입력하세요."
                maxlength="100">

            <button
                type="button"
                id="addNameButton"
                class="primary-button">

                + 이름 추가

            </button>

        </form>


        <div id="nameManageList">
        </div>


        <button
            type="button"
            class="secondary-button full-button"
            onclick="document.getElementById('nameDialog').close()">

            닫기

        </button>

    </dialog>


    <!-- =================================
         기원문 관리 창
    ================================== -->

    <dialog id="prayerDialog" class="manage-dialog">

        <div class="dialog-header">

            <h2>🌷 기원문 관리</h2>

            <button
                type="button"
                onclick="document.getElementById('prayerDialog').close()">

                ✕

            </button>

        </div>


        <form id="prayerAddForm">

            <input
                type="text"
                id="prayerTitleInput"
                placeholder="기원문 제목을 입력하세요."
                maxlength="150">

            <textarea
                id="prayerTextInput"
                placeholder="기원문 내용을 입력하세요."
                rows="5">
            </textarea>

            <button
                type="button"
                id="addPrayerButton"
                class="primary-button">

                + 기원문 추가

            </button>

        </form>


        <div id="prayerManageList">
        </div>


        <button
            type="button"
            class="secondary-button full-button"
            onclick="document.getElementById('prayerDialog').close()">

            닫기

        </button>

    </dialog>


    <!-- =================================
         앱 실행
    ================================== -->

    <script src="./app.js"></script>

</body>
</html>
